name: quality-gates
# CI-side equivalents of the LOCAL pre-commit hooks (gitleaks + cite_check).
# Purpose: anything that commits via the GitHub API — Jules, other coding
# agents, web-UI edits, pushes from machines without the hooks — bypasses
# local pre-commit entirely. This workflow closes that gap at PR/push time.
#
# Canonical checker + bibliography: herrrickshaw/global-market-research-platform
#   market-pipeline/code/python_files/{cite_check.py,references.bib}
# Non-canonical repos fetch them at run time (branch, then main fallback).
# Deployed 2026-08-02 by the literature-audit follow-up; template kept in the
# canonical repo at market-pipeline/code/python_files/quality-gates.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secrets (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # --no-git scans the checked-out tree only (the CI analogue of the local
      # `gitleaks protect --staged` hook). Deliberately NOT scanning history:
      # historic leaks are already catalogued and purged; re-flagging them
      # would make the gate permanently red.
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --redact --no-banner --source .

  cite-check:
    name: citations (references.bib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Run citation check
        run: |
          set -e
          CANON_DIR="market-pipeline/code/python_files"
          if [ -f "$CANON_DIR/cite_check.py" ]; then
            # This IS the canonical repo — run its own copy, scoped to the
            # audited subtree (the wider home-repo tree is out of audit scope).
            cd "$CANON_DIR"
            python3 cite_check.py --all
          else
            RAW="https://raw.githubusercontent.com/herrrickshaw/global-market-research-platform"
            mkdir -p .ci_cite
            for f in cite_check.py references.bib; do
              curl -fsSL "$RAW/claude/strategy-pipeline/market-pipeline/code/python_files/$f" -o ".ci_cite/$f" \
                || curl -fsSL "$RAW/main/market-pipeline/code/python_files/$f" -o ".ci_cite/$f"
            done
            CITE_CHECK_BIB="$PWD/.ci_cite/references.bib" python3 .ci_cite/cite_check.py --all
          fi

  pipeline-invariants:
    name: pipeline invariants (offline)
    runs-on: ubuntu-latest
    # Only this repo carries the pipeline; the workflow is templated into
    # sibling repos where these files do not exist.
    if: github.repository == 'herrrickshaw/global-market-research-platform'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The suite is hermetic — no network, no warehouse, no user data — but it
      # still has to IMPORT the modules it asserts on, so this set is derived
      # from their actual imports rather than guessed. Dropping duckdb or
      # yfinance does not fail the gate: it makes four checks SKIP, which is a
      # suite quietly covering less than it appears to. Installing the full
      # requirements.txt is the other error — cassandra-driver and friends are
      # more ways for the gate to go red for reasons unrelated to the code.
      - name: Install the checked dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            pandas duckdb yfinance exchange_calendars tenacity filelock requests
      # EXPECT ONE SKIP. refresh_panels resolves the warehouse path at import and
      # raises by design when it is absent (no silent fallback to a stale repo
      # copy), so its bar-validation check cannot run on a runner with no data.
      # It skips with that reason and the summary counts it — partial coverage
      # stays visible instead of being mistaken for a clean run.
      - name: Run invariants
        working-directory: market-pipeline/code/python_files
        run: python3 test_pipeline_invariants.py -v
