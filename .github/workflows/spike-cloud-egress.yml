---
# SPIKE — throwaway diagnostic, not part of the daily pipeline.
#
# Question it answers: can a GitHub Actions runner fetch the data the daily
# market pipeline needs, or does NSE (and/or Yahoo) block datacenter egress?
#
# This decides the migration architecture:
#   all three legs PASS  -> lift the whole pipeline to Actions + Dropbox
#   NSE fails            -> hybrid; India needs a residential-IP path
#
# Read-only: fetches public EOD files into the runner's temp dir and throws
# them away. Touches no repo data, needs no secrets, writes nothing back.
# Delete this file once the answer is recorded.

name: spike · cloud egress reachability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # Two different egress IP classes for the price of one run.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the exact clients the pipeline uses
        run: pip install --quiet 'nse>=3.0' 'yfinance>=0.2.40' requests pandas

      - name: Egress identity (who does NSE think we are)
        continue-on-error: true
        run: |
          echo "runner: ${{ matrix.os }}"
          curl -s --max-time 20 https://ipinfo.io/json || echo "ipinfo unreachable"

      # ---- Leg 1: NSE bhavcopy, via the same `nse` client bhavcopy_history.py uses ----
      # The library's cookie bootstrap against nseindia.com is the exact thing
      # NSE's edge filters on, so we go through it rather than curl a URL.
      - name: 'Leg 1 · NSE bhavcopy (nse.NSE.equityBhavcopy)'
        id: nse
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import datetime as dt, tempfile, traceback, sys
          from nse import NSE

          # Walk back over recent weekdays so a holiday doesn't read as a block.
          days, d = [], dt.date.today() - dt.timedelta(days=1)
          while len(days) < 7:
              if d.weekday() < 5:
                  days.append(d)
              d -= dt.timedelta(days=1)

          try:
              client = NSE(download_folder=tempfile.mkdtemp())
          except Exception:
              print("!! FAIL — NSE() bootstrap refused (cookie/session handshake blocked)")
              traceback.print_exc()
              sys.exit(1)

          for day in days:
              try:
                  p = client.equityBhavcopy(date=dt.datetime(day.year, day.month, day.day))
                  print(f"ok PASS — {day} bhavcopy retrieved -> {p}")
                  sys.exit(0)
              except Exception as e:
                  print(f"   {day}: {type(e).__name__}: {e}")

          print("!! FAIL — no bhavcopy retrieved across 7 weekdays (treat as blocked)")
          sys.exit(1)
          PY

      # ---- Leg 2: BSE bhavcopy, the literal URL from bhavcopy_history.py:211 ----
      - name: 'Leg 2 · BSE bhavcopy (direct CSV)'
        id: bse
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import datetime as dt, sys, requests

          sess = requests.Session()
          sess.headers.update({"User-Agent": "Mozilla/5.0",
                               "Referer": "https://www.bseindia.com/"})

          days, d = [], dt.date.today() - dt.timedelta(days=1)
          while len(days) < 7:
              if d.weekday() < 5:
                  days.append(d)
              d -= dt.timedelta(days=1)

          for day in days:
              url = ("https://www.bseindia.com/download/BhavCopy/Equity/"
                     f"BhavCopy_BSE_CM_0_0_0_{day:%Y%m%d}_F_0000.CSV")
              try:
                  r = sess.get(url, timeout=30)
                  print(f"   {day}: HTTP {r.status_code}, {len(r.content)} bytes")
                  if r.status_code == 200 and len(r.content) > 1000:
                      print(f"ok PASS — {day} BSE bhavcopy retrieved")
                      sys.exit(0)
              except Exception as e:
                  print(f"   {day}: {type(e).__name__}: {e}")

          print("!! FAIL — no BSE bhavcopy retrieved across 7 weekdays")
          sys.exit(1)
          PY

      # ---- Leg 3: yfinance, which every non-India leg depends on ----
      # Yahoo throttles datacenter IPs harder than residential. A pass here is
      # necessary but NOT sufficient — real runs pull thousands of symbols.
      - name: 'Leg 3 · yfinance sample'
        id: yf
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import sys, yfinance as yf

          # One per market the pipeline covers.
          tickers = ["RELIANCE.NS", "AAPL", "ADS.DE", "7203.T", "005930.KS"]
          got = []
          for t in tickers:
              try:
                  h = yf.Ticker(t).history(period="5d")
                  n = len(h)
                  print(f"   {t}: {n} bars")
                  if n:
                      got.append(t)
              except Exception as e:
                  print(f"   {t}: {type(e).__name__}: {e}")

          print(f"{len(got)}/{len(tickers)} tickers returned data")
          # Partial success still means throttling worth knowing about.
          sys.exit(0 if len(got) == len(tickers) else 1)
          PY

      # ---- Leg 4: NVIDIA NIM API (integrate.api.nvidia.com) ----
      # llm_extract.py (PR #7) routes structured extraction through NVIDIA's
      # Nemotron-3.5-Lightning as the new primary provider. This host was
      # unreachable from the Claude Code sandbox's own egress proxy while
      # building that change -- this leg checks whether it's *also* blocked
      # from a GitHub Actions runner, which is what actually matters for
      # production. No NVIDIA_API_KEY secret is configured, so this sends an
      # unauthenticated request: any HTTP response (401/403 included) proves
      # the host is reachable; only a connection/DNS/timeout error means
      # egress is blocked.
      - name: 'Leg 4 · NVIDIA NIM API (integrate.api.nvidia.com)'
        id: nvidia
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import sys, requests

          url = "https://integrate.api.nvidia.com/v1/chat/completions"
          try:
              r = requests.post(url, json={
                  "model": "nvidia/nemotron-3.5-lightning-30b-a3b",
                  "messages": [{"role": "user", "content": "ping"}],
              }, timeout=20)
              print(f"HTTP {r.status_code}")
              print(r.text[:500])
              print("ok PASS — host reachable (egress not blocked)")
              sys.exit(0)
          except requests.exceptions.RequestException as e:
              print(f"!! FAIL — {type(e).__name__}: {e}")
              sys.exit(1)
          PY

      # ---- Leg 5: SEC EDGAR (sec_s1_scraper.py, US S-1 IPO filings) ----
      # www.sec.gov was also unreachable from the sandbox this was written in.
      # No SEC_EDGAR_USER_AGENT secret is configured for this throwaway probe --
      # SEC just requires SOME compliant "name email" identity string, so this
      # uses a clearly-throwaway one; the real script requires the env var and
      # will refuse to run without it (see sec_s1_scraper.py's _user_agent()).
      - name: 'Leg 5 · SEC EDGAR (current S-1 filings feed)'
        id: edgar
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import sys, requests

          url = ("https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent"
                 "&type=S-1&company=&dateb=&owner=include&count=5&output=atom")
          headers = {"User-Agent": "spike-cloud-egress-probe test@example.com"}
          try:
              r = requests.get(url, headers=headers, timeout=20)
              print(f"HTTP {r.status_code}, {len(r.content)} bytes")
              print(r.text[:300])
              if r.status_code == 200 and len(r.content) > 200:
                  print("ok PASS — EDGAR reachable and returned a feed")
                  sys.exit(0)
              print("!! FAIL — reachable but not a usable response")
              sys.exit(1)
          except requests.exceptions.RequestException as e:
              print(f"!! FAIL — {type(e).__name__}: {e}")
              sys.exit(1)
          PY

      # ---- Leg 6: Hugging Face (datasets referenced from llm_extract.py's
      # 2026-08 research pass -- scholarly360's DRHP dataset, gtfintechlab's
      # IPO-Mine) ----
      # huggingface.co itself was unreachable from the sandbox this was
      # written in. Uses the public, unauthenticated datasets-server API
      # (no HF token needed for public datasets) rather than the `datasets`
      # package, to keep this leg fast.
      - name: 'Leg 6 · Hugging Face datasets-server (scholarly360 + gtfintechlab)'
        id: hf
        continue-on-error: true
        run: |
          python -u - <<'PY'
          import sys, requests

          datasets = [
              "scholarly360/indian_ipo_prospectus_data",
              "gtfintechlab/ipo-tables",
          ]
          ok = []
          for ds in datasets:
              url = (f"https://datasets-server.huggingface.co/rows?dataset={ds}"
                     "&config=default&split=train&offset=0&length=1")
              try:
                  r = requests.get(url, timeout=20)
                  print(f"   {ds}: HTTP {r.status_code}, {len(r.content)} bytes")
                  if r.status_code == 200:
                      ok.append(ds)
              except requests.exceptions.RequestException as e:
                  print(f"   {ds}: {type(e).__name__}: {e}")

          print(f"{len(ok)}/{len(datasets)} datasets reachable")
          sys.exit(0 if ok else 1)
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo ""
            echo "| leg | source | result |"
            echo "|---|---|---|"
            echo "| 1 | NSE bhavcopy       | ${{ steps.nse.outcome }} |"
            echo "| 2 | BSE bhavcopy       | ${{ steps.bse.outcome }} |"
            echo "| 3 | yfinance           | ${{ steps.yf.outcome  }} |"
            echo "| 4 | NVIDIA NIM API     | ${{ steps.nvidia.outcome }} |"
            echo "| 5 | SEC EDGAR          | ${{ steps.edgar.outcome }} |"
            echo "| 6 | Hugging Face (HF)  | ${{ steps.hf.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
