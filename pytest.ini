[pytest]
# `testpaths` keeps a bare `pytest` at the repo root pointed at the one suite
# that lives here. Without it, collection walks the whole tree and dies on
# Colab exports and on the `market-pipeline/test_*.py` files, which are live
# API probes (they hit DART/EDGAR/J-Quants/Marketaux over the network), not
# unit tests.
#
# The second real suite has its own package root and is run separately —
# see the `test` job in .github/workflows/ci.yml:
#
#     cd stock-portfolio-evaluator && python -m pytest tests/
#
testpaths = tests

# Surface warnings rather than hiding them, but don't fail the run on them —
# several modules call warnings.filterwarnings("ignore") at import time.
filterwarnings =
    default
